<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"/>

<meta name="robots" content="noindex"/>
<title>NexuLex AI</title>
<style>
body{margin:0;background:#0A0F1D;color:#F8FAFC;font-family:system-ui,sans-serif;line-height:1.45}
main{max-width:720px;margin:0 auto;padding:28px 20px 160px}
.accent{color:#00F5D4}
h1{font-size:22px;font-weight:700;line-height:1.3;margin:8px 0 12px}
.pitch{font-size:16px;margin:0 0 14px}
.body{color:#CBD5E1;margin:0 0 12px}
.code{color:#00F5D4;font-weight:700;letter-spacing:0.08em;font-size:20px;margin:12px 0 18px}
.cta{display:flex;flex-direction:column;gap:10px;margin-top:22px;width:100%}
.cta a{display:block;box-sizing:border-box;width:100%;text-align:center;text-decoration:none;border-radius:12px;padding:14px 16px;font-weight:600;min-height:48px;line-height:20px}
.cta a.primary{background:#00F5D4;color:#080C14}
.cta a.store{background:transparent;border:1px solid #00F5D4;color:#00F5D4}
.note{color:#94A3B8;font-size:14px;margin:4px 0 0}
.legal{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0 16px}
.legal a{color:#00F5D4;font-size:14px}
.disclaimer{color:#94A3B8;font-size:13px;margin:18px 0 0}
.lang{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.lang button{background:transparent;border:1px solid #1E293B;color:#94A3B8;border-radius:8px;padding:8px 12px;font-weight:600}
.lang button.active{border-color:#00F5D4;color:#00F5D4}
.hidden{display:none}
[dir=rtl]{text-align:right}
</style>
</head>

<p class="accent">NexuLex AI</p>

<button type="button" data-lang="pt">PT</button>
<button type="button" data-lang="nl">NL</button>
</nav>

<p id="pitch" class="pitch"></p>
<p id="body" class="body"></p>
<p id="code-line" class="code hidden"></p>
<div class="cta">
<a id="open-app" class="primary" href="nexulex://share/"></a>
<a id="play-store" class="store hidden" href="__PLAY_STORE_HREF__" rel="noopener"></a>
<p id="app-store-note" class="note"></p>
</div>
<nav class="legal">
<a id="privacy-link" href="privacy.html"></a>
<a id="terms-link" href="terms.html"></a>
<a id="delete-link" href="delete-account.html"></a>
</nav>

</main>

  var BODY = {
    tr: 'Google Play düğmesi yalnızca liste yayındaysa görünür. App Store listesi henüz canlı değil; bir Apple uygulama numarası yok. Kullandığınız NexuLex AI uygulamasını açın, ardından 8 karakterlik kodu yapıştırın.',

    es: 'El boton de Google Play solo aparece cuando la ficha esta publicada. La ficha de App Store aun no esta activa y no hay numero de app de Apple. Abra la app NexuLex AI que ya usa y pegue el codigo de 8 caracteres.',
    ar: 'زر Google Play يظهر فقط عندما تُنشر القائمة. قائمة App Store ليست متاحة بعد ولا يوجد رقم تطبيق Apple. افتح تطبيق NexuLex AI الذي تستخدمه ثم الصق الرمز المكوّن من 8 أحرف.',
    it: 'Il pulsante Google Play compare solo quando la scheda e pubblicata. La scheda App Store non e ancora online e non c e un numero app Apple. Apri l app NexuLex AI che gia usi, poi incolla il codice di 8 caratteri.',

    ja: 'Google Play ボタンは掲載が公開されているときだけ出ます。App Store 掲載はまだ公開されておらず、Apple のアプリ番号もありません。利用中の NexuLex AI アプリを開き、8文字のコードを貼り付けてください。',

  var CODE_LINE = {
    tr: 'Kodunuz: ',
    en: 'Your code: ',
    de: 'Ihr Code: ',

    es: 'Tu código: ',

  var PLAY = {
    tr: 'Google Play’de aç',
    en: 'Open on Google Play',
    de: 'In Google Play oeffnen',
    fr: 'Ouvrir sur Google Play',
    es: 'Abrir en Google Play',
    ar: 'افتح في Google Play',
    it: 'Apri su Google Play',
    zh: '在 Google Play 中打开',

  var APPSTORE = {
    tr: 'App Store listesi henüz canlı değil. Açılacak bir Apple uygulama numarası yok.',
    en: 'The App Store listing is not live yet. There is no Apple app number to open.',
    de: 'Der App-Store-Eintrag ist noch nicht live. Es gibt keine Apple-App-Nummer zum Oeffnen.',
    fr: 'La fiche App Store n est pas encore en ligne. Il n y a pas de numero d app Apple a ouvrir.',
    es: 'La ficha de App Store aun no esta activa. No hay numero de app de Apple que abrir.',
    ar: 'قائمة App Store ليست متاحة بعد. ولا يوجد رقم تطبيق Apple لفتحه.',
    it: 'La scheda App Store non e ancora online. Non c e un numero app Apple da aprire.',
    zh: 'App Store 列表尚未上线。没有可打开的 Apple 应用编号。',
    ru: 'Карточки App Store ещё нет. Номера приложения Apple, который можно открыть, нет.',
    fa: 'فهرست App Store هنوز زنده نیست. شماره برنامه اپلی برای بازکردن نیست.',
    ja: 'App Store 掲載はまだ公開されていません。開く Apple のアプリ番号はありません。',
    pt: 'A ficha da App Store ainda nao esta ativa. Nao ha numero de app da Apple para abrir.',
    nl: 'De App Store-fiche is nog niet live. Er is geen Apple-appnummer om te openen.'
  };
  var PRIVACY = {
    tr: 'Gizlilik', en: 'Privacy', de: 'Datenschutz', fr: 'Confidentialite', es: 'Privacidad',
    ar: 'الخصوصية', it: 'Privacy', zh: '隐私', ru: 'Конфиденциальность', fa: 'حریم خصوصی',
    ja: 'プライバシー', pt: 'Privacidade', nl: 'Privacy'
  };
  var TERMS = {
    tr: 'Kullanim kosullari', en: 'Terms of use', de: 'Nutzungsbedingungen', fr: 'Conditions d utilisation', es: 'Terminos de uso',
    ar: 'شروط الاستخدام', it: 'Termini di utilizzo', zh: '使用条款', ru: 'Условия использования', fa: 'شرایط استفاده',

  };
  var DELETE = {
    tr: 'Hesabi sil', en: 'Delete account', de: 'Konto loeschen', fr: 'Supprimer le compte', es: 'Eliminar cuenta',
    ar: 'حذف الحساب', it: 'Elimina account', zh: '删除账户', ru: 'Удалить аккаунт', fa: 'حذف حساب',

  var DISCLAIMER = {

    en: 'NexuLex is not a law firm. This is not legal advice and NexuLex does not represent you.',
    de: 'NexuLex ist keine Kanzlei. Dies ist keine Rechtsberatung und NexuLex vertritt Sie nicht.',

    es: 'NexuLex no es un bufete. Esto no es asesoramiento juridico y NexuLex no te representa.',
    ar: 'NexuLex ليس مكتب محاماة. هذه ليست استشارة قانونية ولا يمثّلك NexuLex.',
    it: 'NexuLex non e uno studio. Questa non e consulenza legale e NexuLex non ti rappresenta.',
    zh: 'NexuLex 不是律师事务所。这不是法律意见，NexuLex 也不代理你。',
    ru: 'NexuLex не адвокатское бюро. Это не юридическая консультация, и NexuLex вас не представляет.',
    fa: 'NexuLex دفتر وکالت نیست. این مشاورهٔ حقوقی نیست و NexuLex نمایندهٔ شما نیست.',
    ja: 'NexuLex は法律事務所ではありません。法的助言ではなく、NexuLex はあなたを代理しません。',
    pt: 'A NexuLex nao e um escritorio. Isto nao e aconselhamento juridico e a NexuLex nao o representa.',
    nl: 'NexuLex is geen advocatenkantoor. Dit is geen juridisch advies en NexuLex vertegenwoordigt u niet.'
  };

  function setText(id, value) {
    var node = document.getElementById(id);
    if (node) node.textContent = value == null ? '' : String(value);
  }

  function pickLocale() {
    var params = new URLSearchParams(location.search);
    var requested = String(params.get('lang') || '').slice(0, 2).toLowerCase();
    var htmlLang = String(document.documentElement.lang || 'tr').slice(0, 2).toLowerCase();
    return LANGS.indexOf(requested) >= 0 ? requested : (LANGS.indexOf(htmlLang) >= 0 ? htmlLang : 'tr');
  }

  function applyPlay(locale) {
    var play = document.getElementById('play-store');
    var href = play.getAttribute('href') || '';
    play.classList.add('hidden');
    if (href.indexOf('https://') !== 0 || href.indexOf('__') >= 0) return;
    try {
      var parsed = new URL(href);
      var host = parsed.hostname.toLowerCase();
      if (host !== 'play.google.com' && host.slice(-16) !== '.play.google.com') return;
      parsed.searchParams.set('hl', locale);
      play.href = parsed.toString();
      play.textContent = PLAY[locale] || PLAY.en;
      play.classList.remove('hidden');
    } catch (err) {
      /* keep hidden when the baked href is not a live Play listing */
    }
  }

  function apply(locale) {
    var rtl = locale === 'ar' || locale === 'fa';
    document.documentElement.lang = locale;
    document.documentElement.dir = rtl ? 'rtl' : 'ltr';

    var params = new URLSearchParams(location.search);
    var code = String(params.get('code') || '').trim().toUpperCase();
    var hasCode = CODE_RE.test(code);

    setText('title', TITLE[locale] || TITLE.tr);
    setText('pitch', PITCH[locale] || PITCH.tr);
    setText('body', BODY[locale] || BODY.tr);
    setText('app-store-note', APPSTORE[locale] || APPSTORE.en);
    setText('privacy-link', PRIVACY[locale] || PRIVACY.en);
    setText('terms-link', TERMS[locale] || TERMS.en);
    setText('delete-link', DELETE[locale] || DELETE.en);
    setText('disclaimer', DISCLAIMER[locale] || DISCLAIMER.en);

    var codeLine = document.getElementById('code-line');
    if (hasCode) {
      codeLine.textContent = (CODE_LINE[locale] || CODE_LINE.tr) + code;
      codeLine.classList.remove('hidden');
    } else {
      codeLine.textContent = '';
      codeLine.classList.add('hidden');
    }

    var openApp = document.getElementById('open-app');
    openApp.textContent = OPEN[locale] || OPEN.tr;
    openApp.href = hasCode ? 'nexulex://share/' + encodeURIComponent(code) : 'nexulex://share/';
    applyPlay(locale);

    var buttons = document.querySelectorAll('#langs button');
    for (var i = 0; i < buttons.length; i += 1) {
      buttons[i].classList.toggle('active', buttons[i].getAttribute('data-lang') === locale);
    }
  }

  var locale = pickLocale();
  apply(locale);

  document.getElementById('langs').addEventListener('click', function (event) {
    var btn = event.target.closest('button[data-lang]');
    if (!btn) return;
    var next = btn.getAttribute('data-lang');
    if (LANGS.indexOf(next) < 0) return;
    var url = new URL(location.href);
    url.searchParams.set('lang', next);
    history.replaceState({}, '', url);
    apply(next);
  });
})();
</script>
</body>
</html>
