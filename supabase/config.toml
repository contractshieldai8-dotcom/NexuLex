
[functions.analyze-contract]
enabled = true
# Anthropic anahtarını taşıyan proxy: yalnızca oturum açmış kullanıcılar
# çağırabilsin diye JWT doğrulaması zorunludur.
# Hosted Edge idle/wall clock is 150s; `timeout` is not a supported config.toml key.
verify_jwt = true
import_map = "./functions/analyze-contract/deno.json"
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/analyze-contract/index.ts"

[functions.notify-support]
enabled = true
verify_jwt = true
entrypoint = "./functions/notify-support/index.ts"

[functions.mint-share]
enabled = true
verify_jwt = true
entrypoint = "./functions/mint-share/index.ts"

[functions.open-share]
enabled = true
verify_jwt = false
entrypoint = "./functions/open-share/index.ts"

[functions.advisor-seat]
enabled = true
verify_jwt = true
entrypoint = "./functions/advisor-seat/index.ts"

# WAVE LR.3 hukuki soru motoru: sabit sunucu talimatı + günlük kota (legal_ask_usage).
[functions.legal-ask]
enabled = true
verify_jwt = true
entrypoint = "./functions/legal-ask/index.ts"

# WAVE LR.5 plan eşitleme: profiles.plan / is_pro yalnızca RevenueCat'ten doğrulanarak yazılır.
[functions.sync-entitlement]
enabled = true
verify_jwt = true
entrypoint = "./functions/sync-entitlement/index.ts"

# WAVE LR.5 Professional araçları: kronoloji, uyuşmazlık listesi, araştırma notu + günlük kota (pro_tool_usage).
[functions.pro-tools]
enabled = true
verify_jwt = true
entrypoint = "./functions/pro-tools/index.ts"

# Hesap silme: kullanıcı yalnızca doğrulanmış JWT'den türetilir; gateway doğrulaması da zorunlu.
[functions.delete-account]
enabled = true
verify_jwt = true
entrypoint = "./functions/delete-account/index.ts"

# WAVE G anonymous product events + error reports: allow-listed props only, no account data; open to signed-out users.
[functions.log-event]
enabled = true
verify_jwt = false
entrypoint = "./functions/log-event/index.ts"
